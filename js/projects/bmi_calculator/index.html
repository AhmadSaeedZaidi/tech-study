<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>BMI Calculator</h1>
        <p>Enter your height and weight</p>
    </header>

    <nav class="main-nav">
        <a href="/colour_changer/">Color Changer</a>
        <a href="/bmi_calculator/">BMI Calculator</a>
        <a href="/digital_clock/">Digital Clock</a>
        <a href="/guess_the_number/">Guess the Number</a>
        <a href="/counter_app/">Counter</a>
        <a href="/todo_list/">To-Do List</a>
        <a href="/quiz_app/">Quiz</a>
    </nav>

    <main class="content">
        <section class="card">
            <h2>Calculate your BMI</h2>
            <form id="bmi-form">
                <label for="height">Height (cm)</label>
                <input type="number" id="height" placeholder="e.g. 170" required>

                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" placeholder="e.g. 65" required>

                <button type="submit" class="btn">Calculate</button>
            </form>
            <div id="result" class="result">Your BMI will appear here</div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Ahmad Saeed Zaidi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
