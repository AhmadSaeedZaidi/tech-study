<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>To-Do List</h1>
        <p>Add tasks and keep track of them</p>
    </header>

    <nav class="main-nav">
        <a href="/colour_changer/">Color Changer</a>
        <a href="/bmi_calculator/">BMI Calculator</a>
        <a href="/digital_clock/">Digital Clock</a>
        <a href="/guess_the_number/">Guess the Number</a>
        <a href="/counter_app/">Counter</a>
        <a href="/todo_list/">To-Do List</a>
        <a href="/quiz_app/">Quiz</a>
    </nav>

    <main class="content">
        <section class="card">
            <h2>My Tasks</h2>
            <form id="todo-form">
                <input type="text" id="task-input" placeholder="Enter a task" required>
                <button type="submit" class="btn">Add Task</button>
            </form>
            <ul id="task-list"></ul>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Ahmad Saeed Zaidi</p>
    </footer>

    <script src="script.js"></script>

</html>
