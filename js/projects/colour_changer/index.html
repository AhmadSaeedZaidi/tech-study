<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Color Changer</h1>
        <p>Click a button to change the background</p>
    </header>

    <nav class="main-nav">
        <a href="/colour_changer/">Color Changer</a>
        <a href="/bmi_calculator/">BMI Calculator</a>
        <a href="/digital_clock/">Digital Clock</a>
        <a href="/guess_the_number/">Guess the Number</a>
        <a href="/counter_app/">Counter</a>
        <a href="/todo_list/">To-Do List</a>
        <a href="/quiz_app/">Quiz</a>
    </nav>

    <main class="content">
        <section class="card">
            <h2>Pick a color</h2>
            <div class="buttons">
                <button class="color-btn" id="grey" style="background-color: grey;">Grey</button>
                <button class="color-btn" id="white" style="background-color: white; color: #333;">White</button>
                <button class="color-btn" id="blue" style="background-color: blue;">Blue</button>
                <button class="color-btn" id="yellow" style="background-color: yellow; color: #333;">Yellow</button>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Ahmad Saeed Zaidi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
