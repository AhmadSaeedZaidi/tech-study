<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Guess the Number</h1>
        <p>I'm thinking of a number between 1 and 100</p>
    </header>

    <nav class="main-nav">
        <a href="/colour_changer/">Color Changer</a>
        <a href="/bmi_calculator/">BMI Calculator</a>
        <a href="/digital_clock/">Digital Clock</a>
        <a href="/guess_the_number/">Guess the Number</a>
        <a href="/counter_app/">Counter</a>
        <a href="/todo_list/">To-Do List</a>
        <a href="/quiz_app/">Quiz</a>
    </nav>

    <main class="content">
        <section class="card">
            <form id="guess-form">
                <input type="number" id="guessField" placeholder="Enter a number (1-100)" min="1" max="100">
                <button type="submit" class="btn">Submit Guess</button>
            </form>

            <div class="info">
                <p id="attempts">Attempts left: 10</p>
                <p id="guesses">Previous guesses: none</p>
                <p id="lowOrHi"></p>
            </div>
            <div id="result"></div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Ahmad Saeed Zaidi</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
